  /api/v2/ts/heatmap/:
    get:
      operationId: ts_heatmap_retrieve
      parameters:
      - in: query
        name: attribute
        schema:
          enum:
          - power
          - voltage
          - current
          - pf
          - soc
          - status
          type: string
          default: power
          minLength: 1
        description: |-
          Attributes to return. Choices are ['power', 'voltage', 'current', 'pf', 'soc', 'status']. Default is 'power'.

          * `power` - POWER
          * `voltage` - VOLTAGE
          * `current` - CURRENT
          * `pf` - PF
          * `soc` - SOC
          * `status` - STATUS
      - in: query
        name: duration
        schema:
          type: string
        description: 'Alternative to start: a pandas compatible timedelta or plain
          seconds. The range ends at stop (default now). Do not combine with start.'
      - in: query
        name: engine
        schema:
          enum:
          - influx
          - timescale
          type: string
          default: influx
          minLength: 1
        description: |-
          Database engine to use for the query (one of ['influx', 'timescale'])

          * `influx` - INFLUX
          * `timescale` - TIMESCALE
      - in: query
        name: fleet
        schema:
          type: string
          minLength: 1
        description: Not supported for heatmap queries (use sites)
      - in: query
        name: metcat
        schema:
          enum:
          - load
          - battery
          - production
          - net
          - calc
          - other
          - all
          type: string
          minLength: 1
        description: |-
          Category of metrics (one of load, battery, production, net, calc, other, all

          * `load` - load
          * `battery` - battery
          * `production` - production
          * `net` - net
          * `calc` - calc
          * `other` - other
          * `all` - all
      - in: query
        name: mets
        schema:
          type: string
          minLength: 1
        description: Comma-delimited metric names (e.g. Net,Import)
      - in: query
        name: named
        schema:
          type: boolean
          default: false
        description: 'Convert site ref like ''bai'' to name ''Big Access Incoming''
          (default: False). '
      - in: query
        name: sites
        schema:
          type: string
          minLength: 1
        description: A single site identifier (heatmap queries support one site)
      - in: query
        name: source
        schema:
          enum:
          - iotawatt
          - inverter
          - nem
          - calc
          type: string
          default: iotawatt
          minLength: 1
        description: |-
          Data source to query (one of ['iotawatt', 'inverter', 'nem', 'calc']). Default is 'iotawatt'

          * `iotawatt` - iotawatt
          * `inverter` - inverter
          * `nem` - nem
          * `calc` - calc
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Start time (inclusive). ISO8601 or epoch.
      - in: query
        name: stop
        schema:
          type: string
          format: date-time
        description: Stop time (exclusive). ISO8601 or epoch. Defaults to now.
      - in: query
        name: timeformat
        schema:
          enum:
          - iso
          - epoch
          - epochms
          type: string
          minLength: 1
        description: |-
          Output format for timestamps (one of ['iso', 'epoch', 'epochms'])

          * `iso` - ISO8601
          * `epoch` - EPOCH
          * `epochms` - EPOCH_MS
      - in: query
        name: timezone
        schema:
          type: string
          minLength: 1
        description: IANA timezone string (e.g. 'Australia/Brisbane'). Defaults to
          first site TZ
      - in: query
        name: units
        schema:
          enum:
          - W
          type: string
          minLength: 1
        description: |-
          [W] (default: W, only valid unit for heatmap queries)

          * `W` - W
      tags:
      - ts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: The single requested site ref mapped to heatmap data
                additionalProperties:
                  type: object
                  description: SiteMetric names mapped to [day of year, hour, W] points
                  additionalProperties:
                    type: array
                    items:
                      type: array
                      description: '[day of year (1-365), hour (0-23), mean metric
                        value]'
                      items: {}
                      minItems: 3
                      maxItems: 3
          description: 'Heatmap data as JSON: hourly mean power (W) for one site,
            pivoted by day of year (1-365) and hour (0-23). The same day in different
            years is averaged.'
