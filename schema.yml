openapi: 3.0.3
info:
  title: Phisaver API
  version: 2.0.0 (v2)
  description: API for the PhiSaver Energy Monitor
paths:
  /api/v2/fleets/:
    get:
      operationId: fleets_list
      parameters:
      - name: id
        required: false
        in: query
        description: Exact ID or comma-separated IDs.
        schema:
          type: string
      tags:
      - fleets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FleetSummary'
          description: ''
  /api/v2/fleets/{id}/:
    get:
      operationId: fleets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - fleets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDetail'
          description: ''
  /api/v2/iotawatts/:
    get:
      operationId: iotawatts_list
      description: List and retrieve IoTaWatts by their globally unique ID.
      parameters:
      - name: id
        required: false
        in: query
        description: Exact ID or comma-separated IDs.
        schema:
          type: string
      - in: query
        name: site
        schema:
          type: string
        description: Exact Site ID or comma-separated Site IDs.
      tags:
      - iotawatts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IotaWattSummary'
          description: ''
  /api/v2/iotawatts/{id}/:
    get:
      operationId: iotawatts_retrieve
      description: List and retrieve IoTaWatts by their globally unique ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: '8 chars max (atm allowing up to 12 for legacy): site|letter  e.g.
            ptw01a eb01b eb01c'
        required: true
      tags:
      - iotawatts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IotaWattDetail'
          description: ''
  /api/v2/iotawatts/{id}/config/:
    get:
      operationId: iotawatts_config_retrieve
      description: List and retrieve IoTaWatts by their globally unique ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: '8 chars max (atm allowing up to 12 for legacy): site|letter  e.g.
            ptw01a eb01b eb01c'
        required: true
      tags:
      - iotawatts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v2/login/:
    post:
      operationId: login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /api/v2/logout/:
    post:
      operationId: logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - logout
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v2/password/change/:
    post:
      operationId: password_change_create
      description: |-
        Calls Django Auth SetPasswordForm save method.

        Accepts the following POST parameters: new_password1, new_password2
        Returns the success/fail message.
      tags:
      - password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v2/password/reset/:
    post:
      operationId: password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
        Returns the success/fail message.
      tags:
      - password
      requestBody:
        content:
          application/json:
            schema:
