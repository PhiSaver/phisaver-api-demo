                  additionalProperties:
                    type: array
                    items:
                      type: array
                      description: '[timestamp, metric value]'
                      items: {}
                      minItems: 2
                      maxItems: 2
              examples:
                Example:
                  value:
                    site1:
                      Net:
                      - - 1672531199
                        - 0.5
