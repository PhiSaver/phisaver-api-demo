                $ref: '#/components/schemas/UserDetails'
          description: ''
components:
  schemas:
    Action:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - id
      - name
    ActionSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
      required:
      - id
      - name
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    BlankEnum:
      enum:
      - ''
    CT:
      type: object
      properties:
        channel:
          type: integer
          maximum: 14
          minimum: 1
          nullable: true
        name:
          type: string
          description: 20 chars max, underscores numbers and letter, starting with
            a letter
          pattern: '[A-Za-z]{1}[_a-zA-Z0-9]{3,19}'
          maxLength: 128
        phase:
          $ref: '#/components/schemas/PhaseEnum'
        comment:
          type: string
          maxLength: 256
        poles:
          type: array
          items:
            type: string
          readOnly: true
        ct_model:
          type: string
          readOnly: true
      required:
      - ct_model
      - poles
    FleetDetail:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 64
        timezone:
          type: string
          readOnly: true
        sites:
          type: array
          items:
            $ref: '#/components/schemas/SiteSummary'
          readOnly: true
      required:
      - id
      - name
      - sites
      - timezone
    FleetSummary:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 64
        timezone:
          type: string
          readOnly: true
        site_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - site_count
      - timezone
    ImageSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    IotaWattDetail:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        router:
          allOf:
          - $ref: '#/components/schemas/RouterReference'
          readOnly: true
          nullable: true
        switchboard:
          allOf:
          - $ref: '#/components/schemas/SwitchBoardReference'
          readOnly: true
        vpn_url:
          type: string
          nullable: true
          description: Return the mapped IoTaWatt VPN URL, if its router is known.
          readOnly: true
        cts:
          type: array
          items:
            $ref: '#/components/schemas/CT'
          readOnly: true
        suffix_letter:
          type: string
          description: Letter to Unique to site. Must be unique within its Site, and
            match ref's suffix
          pattern: '[a-z]'
          maxLength: 1
        description:
          type: string
          maxLength: 256
        vt_model:
          $ref: '#/components/schemas/VtModelEnum'
        vt_phase:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhaseEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        phase_rotation:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhaseRotationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - cts
      - id
      - name
      - router
      - switchboard
      - vpn_url
    IotaWattReference:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    IotaWattSummary:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        router:
          allOf:
          - $ref: '#/components/schemas/RouterReference'
          readOnly: true
          nullable: true
        switchboard:
          allOf:
          - $ref: '#/components/schemas/SwitchBoardReference'
          readOnly: true
      required:
      - id
      - name
      - router
      - switchboard
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    NullEnum:
      enum:
      - null
    PasswordChange:
      type: object
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordReset:
      type: object
      description: Serializer for requesting a password reset e-mail.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetConfirm:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
        uid:
          type: string
        token:
          type: string
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PatchedAction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedRouterUpdate:
      type: object
      properties:
        status:
          type: string
          maxLength: 64
        notes:
          type: string
          maxLength: 256
        iccid:
          type: string
          title: ICCID (SIM)
          description: Integrated Circuit Card Identification Number  (18-22 digits)
            identified the SIMM card
          maxLength: 22
        imei:
          type: string
          title: IMEI (router)
          description: International Mobile Station Equipment (15 digits) identified
            the router
          maxLength: 15
    PatchedSiteMetric:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        display_name:
          type: string
          maxLength: 64
        display_description:
          type: string
          maxLength: 300
        category:
          type: string
          readOnly: true
    PatchedUserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        email:
          type: string
          format: email
          readOnly: true
    PhaseEnum:
      enum:
      - R
      - W
      - B
      type: string
      description: |-
        * `R` - Red
        * `W` - White
        * `B` - Blue
    PhaseRotationEnum:
      enum:
      - CW
      - CCW
      type: string
      description: |-
        * `CW` - Clockwise
        * `CCW` - Counter Clockwise
    Pole:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        phase:
          allOf:
          - $ref: '#/components/schemas/PhaseEnum'
          description: |-
            Phase of the pole (Red, Green, Blue, etc.)

            * `R` - Red
            * `W` - White
            * `B` - Blue
        current:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Current in amps
      required:
      - id
      - name
    Rates:
      type: object
      properties:
        import_rate:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Cost to import energy
        export_rate:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Amount credited for exported energy
        service_rate:
          type: number
          format: double
          maximum: 10000
          minimum: -10000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Daily cost, regardless of usage
        billing_days:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Bill frequency, typically 30 (monthly) or 120 (quarterly)
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    RouterCreate:
      type: object
      properties:
        id:
          type: string
          maxLength: 50
        site_id:
          type: string
          maxLength: 50
        switchboard_id:
          type: string
          maxLength: 64
        iccid:
          type: string
          maxLength: 22
        imei:
          type: string
          maxLength: 15
        status:
          type: string
          maxLength: 64
        notes:
          type: string
          maxLength: 256
      required:
      - id
      - site_id
      - switchboard_id
    RouterDetail:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          type: string
          maxLength: 64
        switchboard:
          allOf:
          - $ref: '#/components/schemas/SwitchBoardReference'
          nullable: true
          readOnly: true
        iotawatt_count:
          type: integer
          readOnly: true
        iccid:
          type: string
          title: ICCID (SIM)
