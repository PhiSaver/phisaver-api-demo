  /api/v2/sites/{site_id}/metrics/:
    get:
      operationId: sites_metrics_list
      description: |-
        Metric metadata (labels for time-series keys) nested under a Site.

        llm: Each mixin supplies one action; the URLconf (``phisaverapi/urls.py``)
        decides which are exposed, and ``get_permissions``/``get_site`` decide who
        may use them:

        ==================  ==============  ===============  ===========================
        Mixin               Route           Who              Sites searched
        ==================  ==============  ===============  ===========================
        ListModelMixin      GET list        authenticated    ``viewable_sites`` (member
        RetrieveModelMixin  GET detail      authenticated    or Fleet member: read-only)
        UpdateModelMixin    PATCH detail    authenticated    ``direct_sites`` (direct
                                                             Site members only)
        CreateModelMixin    POST list       superuser        all Sites
        DestroyModelMixin   DELETE detail   superuser        all Sites (via direct_sites,
                                                             which is all for superusers)
        ==================  ==============  ===============  ===========================

        ``UpdateModelMixin`` also provides ``update`` (PUT), but PUT is not routed;
        only PATCH is exposed. See ``SiteMetric`` for why access is split this way.
      parameters:
      - name: id
        required: false
        in: query
        description: Exact ID or comma-separated IDs.
        schema:
          type: string
      - in: path
        name: site_id
        schema:
          type: string
        required: true
      tags:
      - sites
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteMetric'
          description: ''
    post:
      operationId: sites_metrics_create
      description: |-
        Metric metadata (labels for time-series keys) nested under a Site.

        llm: Each mixin supplies one action; the URLconf (``phisaverapi/urls.py``)
        decides which are exposed, and ``get_permissions``/``get_site`` decide who
        may use them:

        ==================  ==============  ===============  ===========================
        Mixin               Route           Who              Sites searched
        ==================  ==============  ===============  ===========================
        ListModelMixin      GET list        authenticated    ``viewable_sites`` (member
        RetrieveModelMixin  GET detail      authenticated    or Fleet member: read-only)
        UpdateModelMixin    PATCH detail    authenticated    ``direct_sites`` (direct
                                                             Site members only)
        CreateModelMixin    POST list       superuser        all Sites
        DestroyModelMixin   DELETE detail   superuser        all Sites (via direct_sites,
                                                             which is all for superusers)
        ==================  ==============  ===============  ===========================

        ``UpdateModelMixin`` also provides ``update`` (PUT), but PUT is not routed;
        only PATCH is exposed. See ``SiteMetric`` for why access is split this way.
      parameters:
      - in: path
        name: site_id
